# Local services: `docker compose up -d` (set POSTGRES_PORT if 5432 is taken). Then:
#   STARTER_APP_DATABASE_URL=postgresql+psycopg://app:app@localhost:5432/app
#   STARTER_APP_TEST_DATABASE_URL=postgresql+psycopg://app:app@localhost:5432/app_test
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
