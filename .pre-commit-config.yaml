# Install once: `uv run pre-commit install`. Local hooks run the project's own locked tools
# (`uv run --locked` never rewrites uv.lock; the uv-lock hook is the one lock check).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict]

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.39.0
    hooks:
      - id: check-github-workflows
      - id: check-gitlab-ci
        args: [--data-transform, gitlab-ci]
      - id: check-renovate
      - id: check-compose-spec
      - id: check-jsonschema
        name: check ast-grep rules
        files: ^rules/.*\.ya?ml$
        args: [--schemafile, https://raw.githubusercontent.com/ast-grep/ast-grep/0.51.0/schemas/rule.json]

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.31.1
    hooks:
      - id: zizmor

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --locked ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format
        language: system
        types: [python]
      - id: ty
        name: ty check
        entry: uv run --locked ty check
        language: system
        types: [python]
        pass_filenames: false
      - id: ast-grep
        name: ast-grep rules
        entry: uv run --locked ast-grep scan
        language: system
        types: [python]
        pass_filenames: false
      - id: ast-grep-rule-tests
        name: ast-grep rule tests
        entry: uv run --locked ast-grep test --skip-snapshot-tests
        language: system
        files: ^(rules|rule-tests)/
        pass_filenames: false
      - id: migration-drift
        name: models match migrations
        entry: uv run --locked pytest -q tests/data/test_migrations.py
        language: system
        files: ^src/starter_app/data/(records\.py|migrations/)
        pass_filenames: false
      - id: uv-lock
        name: uv.lock is current
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
