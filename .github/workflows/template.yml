name: Template

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  generate:
    name: ${{ matrix.database }} / ${{ matrix.forge }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
        forge: [github, gitlab, none]
    env:
      DATABASE: ${{ matrix.database }}
      FORGE: ${{ matrix.forge }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true
      - run: uv sync --locked
      - name: Build the template
        run: uv run python scripts/build_template.py "$RUNNER_TEMP/template-source"
      - name: Generate a project
        run: >-
          uv run copier copy --defaults
          --data project_name=acme-billing --data database="$DATABASE" --data forge="$FORGE"
          "$RUNNER_TEMP/template-source" "$RUNNER_TEMP/acme-billing"
      - name: The generated project has the right files and passes its own checks
        run: >-
          uv run python scripts/check_generated.py "$RUNNER_TEMP/acme-billing"
          --database "$DATABASE" --forge "$FORGE"

  update:
    name: copier update
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true
      - run: uv sync --locked
      - name: A project generated from one release updates cleanly to the next
        run: uv run python scripts/check_update.py "$RUNNER_TEMP/update-check"
