name: Template

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  generate:
    name: ${{ matrix.database }} / ${{ matrix.forge }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
        forge: [github, gitlab]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Build the template
        run: uv run python scripts/build_template.py "$RUNNER_TEMP/template-source"
      - name: Generate a project
        run: >-
          uv run copier copy --defaults
          --data project_name=acme-billing
          --data database=${{ matrix.database }} --data forge=${{ matrix.forge }}
          "$RUNNER_TEMP/template-source" "$RUNNER_TEMP/acme-billing"
      - name: The generated project has the right files and passes its own checks
        run: >-
          uv run python scripts/check_generated.py "$RUNNER_TEMP/acme-billing"
          --database ${{ matrix.database }} --forge ${{ matrix.forge }}
