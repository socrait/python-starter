# Tags a release: builds template/ from main, commits it on a commit only the tag points
# to, and pushes the tag. `copier copy gh:<owner>/<repo>` uses the newest tag.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to tag, e.g. v0.2.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check the version format
        env:
          VERSION: ${{ inputs.version }}
        run: '[[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Use vMAJOR.MINOR.PATCH"; exit 1; }'
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked
      - run: uv run python scripts/build_template.py .
      - name: Commit the template and tag it
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --force template
          git commit --quiet -m "Release $VERSION"
          git tag "$VERSION"
          git push origin "refs/tags/$VERSION"
      - name: Publish release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release create "$VERSION" --verify-tag --generate-notes
