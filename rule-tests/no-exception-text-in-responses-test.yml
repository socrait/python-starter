id: no-exception-text-in-responses
valid:
  - raise HTTPException(status_code=404, detail="Not found")
  - |
    # sg-ignore(no-exception-text-in-responses): reason the rule doesn't apply here
    raise HTTPException(status_code=500, detail=str(e))
invalid:
  - |
    # sg-ignore(some-other-rule): names a different rule, so this one still fires
    raise HTTPException(status_code=500, detail=str(e))
  - |
    # sg-ignore: unnamed suppressions are not honored
    raise HTTPException(status_code=500, detail=str(e))
  - raise HTTPException(status_code=500, detail=str(e))
  - raise HTTPException(status_code=400, detail=repr(exc))
